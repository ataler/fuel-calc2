version: '2.2'
services:
  web:
    depends_on:
      - db
    build: ./fuel-calc
    ports:
      - "5000:5000"
    volumes:
      - ./fuel-calc:/fuel-calc
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://user:password@db:5432/fuel_db
    restart: always 
     
  db:
    image: postgres:alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fuel_db
    ports:
      - "5432:5432"
